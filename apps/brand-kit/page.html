<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Brand Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#edf3ef;--card:#fff;--line:#dfe8e2;--t:#17251d;--t2:#5b6d62;--g:#1f7a4d;--g2:#e3f2e9;--bad:#b42318;
  --s2:#fff4dc;--s2-t:#8a5a00;--s4:#e1f5e9;--s4-t:#1d6b41;--s5:#fde8e6;--s5-t:#a5352a;
  --r:12px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0f1512;--card:#17201b;--line:#29352e;--t:#e8efe9;--t2:#a3b0a8;--g:#4fc285;--g2:#1d3327;--bad:#ef6b5e;
  --s2:#3a2f15;--s2-t:#f0c66b;--s4:#173726;--s4-t:#7fdba6;--s5:#3a1d1a;--s5-t:#f2a097;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--g)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:20px;margin:0 8px 0 0;font-weight:800;letter-spacing:-.2px}
.bar h2{font-size:18px;margin:0;font-weight:800}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--t);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px;min-height:32px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.tcard:focus-visible,.pick:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--t2);min-height:38px}
.seg button.on{background:var(--g2);color:var(--g)}
.f{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-width:0;width:100%;min-height:38px}
textarea.f{resize:vertical}
.muted{color:var(--t2)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.msg{padding:10px 12px;border-radius:10px;background:var(--s2);color:var(--s2-t);margin:10px 0}
.msg.err{background:var(--s5);color:var(--s5-t)}
.msg.ok{background:var(--s4);color:var(--s4-t)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.tag.draft{background:var(--s2);color:var(--s2-t)}
.empty{padding:28px;text-align:center;color:var(--t2)}
.hint{font-size:12.5px;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
/* template */
.tcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:inherit;font:inherit;width:100%;padding:10px}
.tcard .th{aspect-ratio:4/5;border-radius:8px;background:var(--g2) center/cover no-repeat;overflow:hidden}
.tcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h3{margin:0;font-size:15px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
/* file */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.file{display:flex;flex-direction:column;gap:6px;padding:10px}
.file .th{position:relative;aspect-ratio:1;border-radius:8px;background:var(--g2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--t2);font-weight:700;font-size:12px}
.file .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
.file .nm{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.cat{margin:6px 0 8px;font-size:15px}
/* disclaimer */
.disc{display:grid;gap:10px}
.disc pre{white-space:pre-wrap;font:inherit;margin:6px 0 10px}
/* isi template */
.fill{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px}
.fld>label,.lbl{font-weight:600;font-size:13px}
.req{color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;min-height:38px}
.chk input{width:18px;height:18px;accent-color:var(--g)}
.sel{display:grid;gap:8px}
.spk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.spk img,.pick img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--g2)}
.spk .nm{font-weight:600;font-size:13px}.spk .tt{font-size:12px;color:var(--t2)}
.spk .crop{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spk .crop label{font-size:11.5px;color:var(--t2);display:grid}
.spk .crop input{width:100%;accent-color:var(--g)}
.picks{display:grid;gap:6px;max-height:260px;overflow:auto}
.pick{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);cursor:pointer;text-align:left;min-height:44px;width:100%}
.prevs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prev{display:flex;flex-direction:column;gap:8px}
.prev canvas{width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.prev h3{margin:0;font-size:14px}
.warn{font-size:12.5px;color:var(--s2-t);background:var(--s2);border-radius:8px;padding:6px 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
dialog{border:0;border-radius:16px;padding:20px;width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--t);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(6,16,10,.35)}
dialog h3{margin:0 0 12px}
/* admin */
.tlist{display:grid;gap:10px}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trow h3{margin:0;font-size:15px}
.dv{display:grid;gap:8px}
.dv textarea{min-height:90px}
.hist{font-size:12.5px;color:var(--t2);display:grid;gap:6px;margin-top:6px}
.hist pre{white-space:pre-wrap;font:inherit;margin:2px 0 0;color:var(--t)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--t2)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:16px;align-items:start}
.stage{position:relative;width:100%;max-width:520px;margin:0 auto;user-select:none;touch-action:none}
.stage canvas{width:100%;height:auto;display:block;border-radius:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.box{position:absolute;border:2px dashed #f5a623;background:rgba(245,166,35,.10);cursor:move;font:600 11px/1.2 var(--font);color:#8a5a00;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 4px;overflow:hidden}
.box.on{border:2px solid #2563eb;background:rgba(37,99,235,.10);color:#1d4ed8;z-index:2}
.box.lock{border-color:#64748b;color:#334155;background:rgba(100,116,139,.10)}
.box .hd{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;background:#2563eb;border:2px solid #fff;border-radius:4px;cursor:nwse-resize}
.trim{position:absolute;border:1px dashed #e11d48;pointer-events:none}
.safe{position:absolute;border:1px dotted #0ea5e9;pointer-events:none}
.pane{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g2 label,.g3 label{display:grid;gap:3px;font-size:12px;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.szs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.szs .btn.on{border-color:var(--g);background:var(--g2);color:var(--g)}
input[type=color].f{padding:2px;height:38px}
@media (max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}}
.cropbox{width:100%;max-width:300px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--g2);touch-action:none;cursor:grab;margin:6px auto}
.cropbox canvas{width:100%;height:100%;display:block}
@media (max-width:860px){.fill{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .btn,.seg button,.f,.chk{min-height:44px}.btn.sm{min-height:44px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prevs{grid-template-columns:minmax(0,1fr)}
}
/* liquid glass (di dalam Tool Hub: token --hg-* dari shared/theme.js) */
html[data-theme]{background:var(--hg-base)}
html[data-theme] body{background:transparent}
html[data-theme] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--hg-mesh)}
html[data-theme] .wrap .card{background:var(--hg-sheen),var(--hg-glass);border-color:var(--hg-edge);border-radius:var(--hg-r-lg);box-shadow:var(--hg-hl),var(--hg-shadow)}
html[data-theme] .wrap .seg{background:var(--hg-sheen),var(--hg-glass);border-color:var(--hg-edge);box-shadow:var(--hg-hl)}
html[data-theme] .wrap .btn:not(.pri),html[data-theme] dialog .btn:not(.pri){background-color:var(--hg-glass);border-color:var(--hg-edge);box-shadow:var(--hg-hl)}
html[data-theme] .wrap .f,html[data-theme] dialog .f{background:var(--hg-solid)}
html[data-theme] dialog{background:var(--hg-float);-webkit-backdrop-filter:var(--hg-blur);backdrop-filter:var(--hg-blur);box-shadow:0 0 0 1px var(--hg-edge),var(--hg-hl),var(--hg-shadow-lg)}
</style>
</head>
<body>
<div class="wrap">
  <!-- beranda: template, file, disclaimer -->
  <div id="vHome">
    <div class="bar"><h1>Brand Kit</h1>
      <div class="seg" role="tablist" aria-label="Bagian Brand Kit"><button type="button" role="tab" data-tab="tpl" class="on">Template</button><button type="button" role="tab" data-tab="file">File</button><button type="button" role="tab" data-tab="disc">Disclaimer</button></div>
      <span class="sp"></span><a class="btn" href="#/admin" id="bAdmin" hidden>Atur Brand Kit</a></div>
    <div id="evBanner" class="msg ok banner" hidden></div>
    <div id="hMsg"></div>
    <section id="tTpl"><div id="tplList" class="grid" aria-live="polite"></div></section>
    <section id="tFile" hidden>
      <div class="bar"><input class="f" id="fQ" type="search" placeholder="Cari nama file" aria-label="Cari file" style="max-width:340px"></div>
      <div id="fMsg"></div><div id="fileList" aria-live="polite"></div>
    </section>
    <section id="tDisc" hidden><p class="hint">Teks resmi. Salin untuk caption, WhatsApp, atau materi lain.</p><div id="discList" class="disc"></div></section>
  </div>

  <!-- isi template & unduh -->
  <div id="vFill" hidden>
    <div class="bar"><a class="btn sm" href="#/">← Kembali</a><h2 id="fillTitle" translate="no"></h2></div>
    <div class="fill">
      <div class="card form" id="fillForm"></div>
      <div>
        <div class="bar"><span class="hint">Pratinjau. Desain, logo, dan disclaimer terkunci.</span><span class="sp"></span><button type="button" class="btn pri" id="bAll">Unduh semua (ZIP)</button></div>
        <div id="dlMsg"></div>
        <div id="prevs" class="prevs"></div>
      </div>
    </div>
  </div>

  <!-- admin (langkah berikutnya) -->
  <div id="vAdmin" hidden></div>
  <div id="vEdit" hidden></div>
</div>

<dialog id="dlgSp"><form id="fSp" method="dialog" novalidate>
  <h3 id="spTitle">Narasumber baru</h3>
  <div class="form">
    <div class="fld"><label for="spName">Nama <span class="req">*</span></label><input class="f" id="spName" maxlength="80" autocomplete="off"></div>
    <div class="fld"><label for="spJob">Jabatan</label><input class="f" id="spJob" maxlength="120" placeholder="mis. Head of Research, KISI" autocomplete="off"></div>
    <div class="fld"><label for="spFile">Foto <span class="req" id="spReq">*</span></label><input class="f" id="spFile" type="file" accept="image/*">
      <div class="cropbox" id="spBox" hidden><canvas id="spCv" width="600" height="600" aria-label="Geser foto untuk mengatur posisi"></canvas></div>
      <label class="small" id="spZoomL" hidden>Zoom <input type="range" id="spZoom" min="1" max="3" step="0.01" value="1" style="width:100%;accent-color:var(--g)"></label>
      <span class="hint">Geser foto di dalam lingkaran untuk mengatur posisi wajah.</span></div>
    <div id="spMsg"></div>
    <div class="acts"><button type="submit" class="btn pri" id="spSave">Simpan</button><button type="button" class="btn" id="spCancel">Batal</button><span class="sp"></span><button type="button" class="btn danger" id="spDel" hidden>Hapus</button></div>
  </div>
</form></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BK=window.BK,ME=BK.me,SIZES=BK.sizes;
const T=s=>window.hubT?window.hubT(s):s;
async function api(path,body,method){
  const r=await fetch(path,body!==undefined?{method:method||"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{cache:"no-store"});
  const j=await r.json().catch(()=>({error:"Respons tidak terbaca (HTTP "+r.status+")"}));
  if(!r.ok||j.error){const e=new Error(T(j.error||("HTTP "+r.status)));e.status=r.status;throw e}
  return j;
}
const showMsg=(box,m,cls="err")=>{$(box).innerHTML=m?`<div class="msg ${cls}" role="${cls==="err"?"alert":"status"}">${esc(m)}</div>`:""};
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const slug=s=>String(s||"brand").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"brand";
const ext=n=>(String(n).includes(".")?String(n).split(".").pop():"").replace(/[^a-z0-9]/gi,"").toUpperCase().slice(0,5)||"FILE";
const fmtSize=n=>!n?"":n<1024*1024?Math.max(1,Math.round(n/1024))+" KB":(n/1048576).toFixed(1)+" MB";
// pustaka dari cdnjs dimuat saat dibutuhkan
const LIBS={qr:"https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js",pdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",zip:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"};
const libP={};
function lib(k){return libP[k]||(libP[k]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=LIBS[k];s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>{delete libP[k];no(new Error(T("Pustaka gagal dimuat. Cek koneksi internet lalu coba lagi.")))};document.head.appendChild(s)}))}
let R=null;const render=()=>R||(R=import("/render.js"));
const imgP={};
function img(src){return imgP[src]||(imgP[src]=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>{delete imgP[src];no(new Error(T("Gambar gagal dimuat.")))};i.src=src}))}

/* =================== DATA BERSAMA =================== */
let TPLS=null,SPK=null,EVENTS=null,EVSEL=null,DISC=null;
const loadTpls=async()=>TPLS||(TPLS=(await api("/api/templates")).templates);
const loadSpk=async(force)=>{if(!SPK||force)SPK=(await api("/api/speakers")).speakers;return SPK};
const loadDisc=async(force)=>{if(!DISC||force)DISC=await api("/api/disclaimers");return DISC};
async function loadEvents(){if(EVENTS)return EVENTS;try{const r=await api("/api/events");EVENTS=r.off?[]:r.events}catch(e){EVENTS=[]}return EVENTS}

/* =================== BERANDA =================== */
let TAB="tpl";
function show(v){["vHome","vFill","vAdmin","vEdit"].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}
function setTab(t){TAB=t;document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===t);b.setAttribute("aria-selected",String(b.dataset.tab===t))});
  $("tTpl").hidden=t!=="tpl";$("tFile").hidden=t!=="file";$("tDisc").hidden=t!=="disc";
  if(t==="file")files();if(t==="disc")discs()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
async function home(){
  show("vHome");$("bAdmin").hidden=!ME.adm;showMsg("hMsg","");
  $("evBanner").hidden=!EVSEL;if(EVSEL)$("evBanner").innerHTML=`<span>${esc(T("Poster untuk event:"))} <b translate="no">${esc(EVSEL.title)}</b> · ${esc(EVSEL.date_label)}</span><span>${esc(T("Pilih template di bawah."))}</span><button type="button" class="btn sm" id="bEvOff">${esc(T("Tanpa event"))}</button>`;
  if(EVSEL)$("bEvOff").onclick=()=>{EVSEL=null;history.replaceState(null,"",location.pathname+location.hash);home()};
  let L;try{L=await loadTpls()}catch(e){showMsg("hMsg",e.message);return}
  const live=L.filter(t=>t.status==="live"&&t.sizes.length);
  $("tplList").innerHTML=live.length?live.map(t=>{const s=t.sizes.find(x=>x.has_bg)||t.sizes[0];
    return `<button type="button" class="card tcard" data-t="${esc(t.id)}"><div class="th">${s&&s.has_bg?`<img src="/bg/${esc(s.id)}" alt="" loading="lazy">`:""}</div><h3 translate="no">${esc(t.name)}</h3>
      <div class="chips">${t.sizes.map(x=>`<span class="tag">${esc(T(SIZES[x.kind].label))}</span>`).join("")}</div></button>`}).join("")
    :`<div class="card empty">${esc(T(ME.adm?"Belum ada template aktif. Buat lewat Atur Brand Kit.":"Belum ada template."))}</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>location.hash="#/t/"+b.dataset.t);
  setTab(TAB);
}
let FILES=null;
async function files(force){
  if(!FILES||force){$("fileList").innerHTML=`<div class="empty">${esc(T("Memuat…"))}</div>`;try{FILES=await api("/api/files"+(force?"?fresh=1":""))}catch(e){showMsg("fMsg",e.message);$("fileList").innerHTML="";return}}
  showMsg("fMsg",FILES.error?T(FILES.error):"","msg");
  const q=$("fQ").value.trim().toLowerCase(),C=FILES.categories.map(c=>({...c,files:c.files.filter(f=>!q||f.name.toLowerCase().includes(q))})).filter(c=>c.files.length);
  $("fileList").innerHTML=C.length?C.map(c=>`<h3 class="cat" translate="no">${esc(c.name==="Lainnya"?T("Lainnya"):c.name)}</h3><div class="fgrid">${c.files.map(f=>`<div class="card file">
    <div class="th"><span>${esc(ext(f.name))}</span>${/^image\/|pdf|presentation|document/.test(f.mime)?`<img src="${esc(f.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>
    <div class="nm" translate="no">${esc(f.name)}</div><div class="hint">${esc(fmtSize(f.size))}</div>
    <div class="acts">${f.download?`<a class="btn sm pri" href="${esc(f.download)}" target="_blank" rel="noopener">${esc(T("Unduh"))}</a>`:""}<a class="btn sm" href="${esc(f.view)}" target="_blank" rel="noopener">${esc(T("Buka"))}</a></div></div>`).join("")}</div>`).join("")
    :`<div class="card empty">${esc(T(q?"Tidak ada file yang cocok.":"Belum ada file."))}</div>`;
}
$("fQ").oninput=()=>files();
async function discs(){
  let D;try{D=await loadDisc()}catch(e){$("discList").innerHTML=`<div class="msg err">${esc(e.message)}</div>`;return}
  const L=D.list.filter(x=>x.text);
  $("discList").innerHTML=L.length?L.map(d=>`<div class="card"><b>${esc(T(d.label))}</b><pre translate="no">${esc(d.text)}</pre><button type="button" class="btn sm" data-copy="${esc(d.key)}">${esc(T("Salin"))}</button></div>`).join("")
    :`<div class="card empty">${esc(T("Belum ada teks disclaimer."))}</div>`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const d=L.find(x=>x.key===b.dataset.copy);
    try{await navigator.clipboard.writeText(d.text);b.textContent=T("Tersalin ✓");setTimeout(()=>b.textContent=T("Salin"),2000)}catch(e){prompt(T("Salin teks ini:"),d.text)}});
}

/* =================== ISI TEMPLATE & UNDUH =================== */

/** Gambar satu ukuran ke canvas pada skala tertentu. */
async function paint(cv,size,scale){
  const Rm=await render(),z=SIZES[size.kind];
  const [bg,logo,disc]=await Promise.all([size.has_bg?img("/bg/"+size.id):null,img(size.dark?"/brand/kisi-white.png":"/brand/kisi-color.png"),discText(size.disc.key),fontsReady(size)]);
  const sp=await Promise.all(ST.sel.map(async s=>({name:s.name,title:s.title,crop:s.crop,img:await img("/photo/"+s.id+"?v="+encodeURIComponent(s.v||"")).catch(()=>null)})));
  let qr=null;if(F.qr&&ST.qrOn&&ST.qrLink){await lib("qr");qr=qrcode(0,"M");qr.addData(ST.qrLink);qr.make()}
  cv.width=Math.round(z.w*scale);cv.height=Math.round(z.h*scale);
  return Rm.draw(cv.getContext("2d"),{size,S:z,bg,logo,values:ST.values,speakers:sp,qr,disclaimer:disc,scale});
}
function redraw(delay=150){clearTimeout(TIMER);TIMER=setTimeout(async()=>{if(!TPL)return;save();
  for(const s of TPL.sizes){const cv=$("cv_"+s.id);if(!cv)continue;const z=SIZES[s.kind];
    try{const r=await paint(cv,s,Math.min(1,460/z.w));const W=[];
      if(r.overflow.length)W.push(T("Teks terlalu panjang untuk kotaknya")+": "+r.overflow.map(f=>f==="speakers"?T("Narasumber"):(F.text.find(x=>x.field===f)||{}).label||f).join(", ")+".");
      if(r.cut)W.push(T("Ukuran ini hanya memuat")+" "+(ST.sel.length-r.cut)+" "+T("narasumber pertama")+".");
      $("w_"+s.id).innerHTML=W.map(w=>`<div class="warn">${esc(w)}</div>`).join("")}
    catch(e){$("w_"+s.id).innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}},delay)}
function missing(){const x=F.text.find(x=>x.required&&!String(ST.values[x.field]||"").trim());if(x){showMsg("dlMsg",T("Isian wajib belum diisi")+": "+x.label+".");$("v_"+x.field).focus();return true}showMsg("dlMsg","");return false}
const toBlob=cv=>new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error(T("Gambar gagal dibuat. Coba lagi."))),"image/png"));
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
/** Buat file ukuran penuh. as = png | pdf | all (semua ukuran dalam ZIP: PNG + PDF untuk ukuran cetak). */
async function download(sizes,as,btn){
  if(missing())return;const old=btn.textContent;btn.disabled=true;btn.textContent=T("Membuat…");
  try{
    const Rm=await render(),out=[];
    for(const s of sizes){const z=SIZES[s.kind],cv=document.createElement("canvas");await paint(cv,s,Rm.canvasScale(z.w,z.h));const base=slug(TPL.name)+"-"+s.kind;
      if(as!=="pdf")out.push([base+".png",await toBlob(cv)]);
      if(z.print&&as!=="png"){await lib("pdf");out.push([base+".pdf",Rm.toPdf(window.jspdf.jsPDF,cv,z.mm)])}
      api("/api/usage",{template_id:TPL.id,kind:s.kind,event_id:EVSEL?EVSEL.id:""}).catch(()=>{})}
    if(as==="all"){await lib("zip");const zip=new JSZip();out.forEach(([n,b])=>zip.file(n,b));saveBlob(await zip.generateAsync({type:"blob"}),slug(TPL.name)+".zip")}
    else out.forEach(([n,b])=>saveBlob(b,n));
  }catch(e){showMsg("dlMsg",e.message)}finally{btn.disabled=false;btn.textContent=old}
}

let SPED=null,SPIMG=null,SPOFF={x:0,y:0},SPZ=1;
function spDialog(s){

  $("dlgSp").showModal();
}
function spPaint(i){const cv=$("spCv"),c=cv.getContext("2d"),iw=i.naturalWidth,ih=i.naturalHeight,sc=Math.max(600/iw,600/ih)*SPZ,dw=iw*sc,dh=ih*sc;
  SPOFF.x=Math.min(0,Math.max(600-dw,SPOFF.x));SPOFF.y=Math.min(0,Math.max(600-dh,SPOFF.y));
  c.fillStyle="#fff";c.fillRect(0,0,600,600);c.drawImage(i,SPOFF.x,SPOFF.y,dw,dh)}
$("spFile").onchange=()=>{const f=$("spFile").files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{SPIMG=i;SPZ=1;$("spZoom").value=1;const sc=Math.max(600/i.naturalWidth,600/i.naturalHeight);SPOFF={x:(600-i.naturalWidth*sc)/2,y:(600-i.naturalHeight*sc)/2};spPaint(i);$("spBox").hidden=false;$("spZoomL").hidden=false};
  i.onerror=()=>showMsg("spMsg",T("File ini bukan gambar."));i.src=u};
$("spZoom").oninput=()=>{if(!SPIMG)return;const old=SPZ;SPZ=+$("spZoom").value;const k=SPZ/old;SPOFF.x=300-(300-SPOFF.x)*k;SPOFF.y=300-(300-SPOFF.y)*k;spPaint(SPIMG)};
(()=>{let drag=null;const cv=$("spCv");
  cv.addEventListener("pointerdown",e=>{if(!SPIMG)return;drag={x:e.clientX,y:e.clientY,ox:SPOFF.x,oy:SPOFF.y};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{if(!drag)return;const k=600/cv.getBoundingClientRect().width;SPOFF.x=drag.ox+(e.clientX-drag.x)*k;SPOFF.y=drag.oy+(e.clientY-drag.y)*k;spPaint(SPIMG)});
  const up=()=>drag=null;cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up)})();
$("spCancel").onclick=()=>$("dlgSp").close();
$("fSp").onsubmit=async e=>{e.preventDefault();const b=$("spSave");

  if(SPIMG){let q=.85,u;do{u=$("spCv").toDataURL("image/jpeg",q);q-=.1}while(u.length>260000&&q>.3);body.photo=u}
  else if(!SPED)return showMsg("spMsg",T("Foto narasumber belum dipilih."));
  b.disabled=true;try{const r=await api("/api/speakers",body);await loadSpk(true);const s=SPK.find(x=>x.id===r.id);
    const i=ST.sel.findIndex(x=>x.id===r.id);if(i>=0)ST.sel[i]={...s,crop:ST.sel[i].crop};else if(!SPED&&ST.sel.length<F.speakers)ST.sel.push({...s,crop:{x:0,y:0,zoom:1}});

/* ---------- editor template ---------- */
let ET=null,ESZ=null,ESEL=null,EIMG=null,ETIMER=0;
const clone=o=>JSON.parse(JSON.stringify(o));
window.editTpl=async function(id){
  show("vEdit");TPLS=null;let L;
  try{L=await loadTpls()}catch(e){$("vEdit").innerHTML=`<div class="msg err">${esc(e.message)}</div>`;return}
  ET=L.find(t=>t.id===id);if(!ET){$("vEdit").innerHTML=`<div class="msg err">${esc(T("Template tidak ditemukan."))}</div>`;return}
  if(!ESZ||!ET.sizes.some(s=>s.id===ESZ.id))ESZ=ET.sizes[0]?clone(ET.sizes[0]):null;else ESZ=clone(ET.sizes.find(s=>s.id===ESZ.id));
  ESEL=null;EIMG=null;drawEditor();
};
function drawEditor(){
  const free=KINDS.filter(k=>!ET.sizes.some(s=>s.kind===k));
  $("vEdit").innerHTML=`<div class="bar"><a class="btn sm" href="#/admin">← Kembali</a><input class="f" id="eName" value="${esc(ET.name)}" maxlength="80" aria-label="${esc(T("Nama template"))}" style="max-width:300px" translate="no">
    <button type="button" class="btn sm" id="eNameS">${esc(T("Simpan nama"))}</button><span class="sp"></span>
    <div class="seg" role="group" aria-label="${esc(T("Status template"))}"><button type="button" data-st="draft" class="${ET.status!=="live"?"on":""}">${esc(T("Draf"))}</button><button type="button" data-st="live" class="${ET.status==="live"?"on":""}">${esc(T("Aktif"))}</button></div></div>
    <div id="eMsg"></div>
    <div class="szs bar">${ET.sizes.map(s=>`<button type="button" class="btn sm${ESZ&&ESZ.id===s.id?" on":""}" data-sz="${esc(s.id)}">${esc(T(SIZES[s.kind].label))}${s.has_bg?"":" ⚠"}</button>`).join("")}
      ${free.length?`<select class="f" id="eKind" style="width:auto">${free.map(k=>`<option value="${k}">${esc(T(SIZES[k].label))}</option>`).join("")}</select><button type="button" class="btn sm" id="eAdd">+ ${esc(T("Ukuran"))}</button>`:""}</div>
    ${ESZ?`<div class="ed"><div><div class="stage" id="stage"><canvas id="eCv"></canvas><div id="eBoxes"></div></div><p class="hint" style="text-align:center">${esc(T("Geser kotak untuk memindahkan, tarik sudut biru untuk mengubah ukuran."))}${SIZES[ESZ.kind].print?" "+esc(T("Garis merah = garis potong, garis biru = batas aman.")):""}</p></div>
      <div class="pane card" id="ePane"></div></div>`:`<div class="card empty">${esc(T("Tambahkan ukuran pertama untuk template ini."))}</div>`}`;
  $("eNameS").onclick=async()=>{try{await api("/api/templates",{id:ET.id,name:$("eName").value});ET.name=$("eName").value.trim();showMsg("eMsg",T("Tersimpan"),"ok")}catch(e){showMsg("eMsg",e.message)}};
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{try{await api("/api/templates",{id:ET.id,name:ET.name,status:b.dataset.st});ET.status=b.dataset.st;TPLS=null;drawEditor();showMsg("eMsg",T(b.dataset.st==="live"?"Template aktif: tampil ke cabang.":"Template disimpan sebagai draf."),"ok")}catch(e){showMsg("eMsg",e.message)}});
  document.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{ESZ=clone(ET.sizes.find(s=>s.id===b.dataset.sz));ESEL=null;EIMG=null;drawEditor()});
  if($("eAdd"))$("eAdd").onclick=async()=>{try{const r=await api("/api/sizes",{template_id:ET.id,kind:$("eKind").value,slots:[]});ESZ={id:r.id};await window.editTpl(ET.id)}catch(e){showMsg("eMsg",e.message)}};
  if(ESZ){drawPane();drawBoxes();ePaint()}
}
const ePx=()=>$("eCv").getBoundingClientRect().width/SIZES[ESZ.kind].w;
// contoh isi untuk pratinjau admin
let SAMPLE=null;
async function sample(){if(SAMPLE)return SAMPLE;const cv=document.createElement("canvas");cv.width=cv.height=200;const x=cv.getContext("2d");x.fillStyle="#9bb7a7";x.fillRect(0,0,200,200);x.fillStyle="#eef5f0";x.beginPath();x.arc(100,82,42,0,7);x.fill();x.beginPath();x.arc(100,210,78,0,7);x.fill();
  await lib("qr");const q=qrcode(0,"M");q.addData("https://contoh.link/daftar");q.make();
  return SAMPLE={img:cv,qr:q}}
function ePaint(){clearTimeout(ETIMER);ETIMER=setTimeout(async()=>{const cv=$("eCv");if(!cv)return;const z=SIZES[ESZ.kind],Rm=await render(),S=await sample();
  try{if(!EIMG&&ESZ.has_bg)EIMG=await img("/bg/"+ESZ.id+"?t="+(ESZ.bgv||0));}catch(e){}
  const logo=await img(ESZ.dark?"/brand/kisi-white.png":"/brand/kisi-color.png"),disc=await discText(ESZ.disc.key)||T("(Disclaimer "+dlabel(ESZ.disc.key)+" belum diisi)");
  await fontsReady(ESZ);const values={};(ESZ.slots||[]).forEach(s=>{if(s.type==="text")values[s.field]=s.def||s.label});
  const scale=Math.min(1,520/z.w);cv.width=Math.round(z.w*scale);cv.height=Math.round(z.h*scale);
  Rm.draw(cv.getContext("2d"),{size:ESZ,S:z,bg:EIMG,logo,values,speakers:[1,2,3,4,5,6].map(i=>({name:T("Nama Narasumber"),title:T("Jabatan"),img:S.img,crop:{}})),qr:S.qr,disclaimer:disc,scale});
  drawBoxes()},120)}
function drawBoxes(){
  const z=SIZES[ESZ.kind],k=ePx(),bx=$("eBoxes");if(!bx||!k)return;
  const px=(x,y,w,h)=>`left:${x*k}px;top:${y*k}px;width:${w*k}px;height:${h*k}px`;
  let h="";
  if(z.print){const dpi=z.w/(z.mm[0]/25.4),t=3/25.4*dpi,s2=6/25.4*dpi;h+=`<div class="trim" style="${px(t,t,z.w-2*t,z.h-2*t)}"></div><div class="safe" style="${px(s2,s2,z.w-2*s2,z.h-2*s2)}"></div>`}
  // lebar logo mengikuti perbandingan file logo (kisi-color.png 1200×206)
  const lg=ESZ.logo,lw=lg.h*1200/206;h+=`<div class="box lock${ESEL==="logo"?" on":""}" data-b="logo" style="${px((z.w-lw)/2,lg.y,lw,lg.h)}">${esc(T("Logo"))}<span class="hd" data-h="logo"></span></div>`;
  const d=ESZ.disc;h+=`<div class="box lock${ESEL==="disc"?" on":""}" data-b="disc" style="${px(d.x,d.y,d.w,Math.max(d.size*2.6,40))}">${esc(T("Disclaimer"))}<span class="hd" data-h="disc"></span></div>`;
  (ESZ.slots||[]).forEach(s=>{const w=s.type==="qr"?s.size:s.w,hh=s.type==="qr"?s.size:s.h;
    h+=`<div class="box${ESEL===s.id?" on":""}" data-b="${esc(s.id)}" style="${px(s.x,s.y,w,hh)}" translate="no">${esc(s.type==="text"?s.label:s.type==="qr"?"QR":T("Narasumber")+" (maks. "+s.max+")")}<span class="hd" data-h="${esc(s.id)}"></span></div>`});
  bx.innerHTML=h;
  bx.querySelectorAll("[data-b]").forEach(el=>el.addEventListener("pointerdown",e=>startDrag(e,el.dataset.b,!!e.target.dataset.h)));
}
function target(id){return id==="logo"?ESZ.logo:id==="disc"?ESZ.disc:ESZ.slots.find(s=>s.id===id)}
function startDrag(e,id,resize){
  e.preventDefault();const k=ePx(),z=SIZES[ESZ.kind],o=target(id),st={x:e.clientX,y:e.clientY,o:clone(o)};
  if(ESEL!==id){ESEL=id;drawPane()}
  const el=e.currentTarget;el.setPointerCapture(e.pointerId);
  const mv=ev=>{const dx=(ev.clientX-st.x)/k,dy=(ev.clientY-st.y)/k,c=(v,lo,hi)=>Math.round(Math.min(hi,Math.max(lo,v)));
    if(id==="logo"){if(resize)o.h=c(st.o.h+dy,20,z.h/3);else o.y=c(st.o.y+dy,0,z.h-o.h)}
    else if(o.type==="qr"){if(resize)o.size=c(st.o.size+Math.max(dx,dy),40,Math.min(z.w-o.x,z.h-o.y));else{o.x=c(st.o.x+dx,0,z.w-o.size);o.y=c(st.o.y+dy,0,z.h-o.size)}}
    else if(id==="disc"){if(resize)o.w=c(st.o.w+dx,50,z.w-o.x);else{o.x=c(st.o.x+dx,0,z.w-o.w);o.y=c(st.o.y+dy,0,z.h-10)}}
    else{if(resize){o.w=c(st.o.w+dx,10,z.w-o.x);o.h=c(st.o.h+dy,10,z.h-o.y)}else{o.x=c(st.o.x+dx,0,z.w-o.w);o.y=c(st.o.y+dy,0,z.h-o.h)}}
    drawBoxes();drawPane();ePaint()};
  const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up)};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
const num=(id,lbl,v,min,max)=>`<label>${esc(T(lbl))}<input class="f" type="number" data-p="${id}" value="${v}" min="${min}" max="${max}"></label>`;
const col=(id,lbl,v)=>`<label>${esc(T(lbl))}<input class="f" type="color" data-p="${id}" value="${esc(v)}"></label>`;
const sel=(id,lbl,v,opts)=>`<label>${esc(T(lbl))}<select class="f" data-p="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?" selected":""}>${esc(T(b))}</option>`).join("")}</select></label>`;
function drawPane(){
  const z=SIZES[ESZ.kind],o=ESEL?target(ESEL):null,fonts=FONTS.map(f=>[f,f]),aligns=[["left","Kiri"],["center","Tengah"],["right","Kanan"]];
  let h=`<div class="fld"><span class="lbl">${esc(T("Gambar latar dari Canva"))} (${z.w}×${z.h} px${z.print?", "+esc(T("dengan bleed 3 mm")):""})</span><input class="f" type="file" id="eBg" accept="image/png,image/jpeg"><span class="hint" id="eBgM">${esc(T(ESZ.has_bg?"Sudah diunggah. Pilih file lain untuk mengganti.":"Belum ada gambar latar."))} ${esc(T("Ekspor tanpa logo dan disclaimer."))}</span></div>
    <label class="chk"><input type="checkbox" id="eDark"${ESZ.dark?" checked":""}> ${esc(T("Latar gelap (logo putih)"))}</label>
    <div class="acts"><button type="button" class="btn sm" data-add="text">+ ${esc(T("Kotak teks"))}</button>${ESZ.slots.some(s=>s.type==="speakers")?"":`<button type="button" class="btn sm" data-add="speakers">+ ${esc(T("Area narasumber"))}</button>`}${ESZ.slots.some(s=>s.type==="qr")?"":`<button type="button" class="btn sm" data-add="qr">+ QR</button>`}</div>`;
  if(o&&ESEL==="logo")h+=`<b>${esc(T("Logo perusahaan"))}</b><div class="g2">${num("y","Jarak dari atas",o.y,0,z.h)}${num("h","Tinggi",o.h,20,z.h/3)}</div><span class="hint">${esc(T("Selalu di tengah. Versi putih dipakai kalau latar gelap."))}</span>`;
  else if(o&&ESEL==="disc")h+=`<b>${esc(T("Disclaimer"))}</b>${ESZ.kind==="xbanner"?`<span class="hint">${esc(T("X-banner selalu memakai versi Singkat."))}</span>`:sel("key","Versi",o.key,DK.map(([k,l])=>[k,l]))}
    <div class="g3">${num("x","X",o.x,0,z.w)}${num("y","Y",o.y,0,z.h)}${num("w","Lebar",o.w,50,z.w)}</div><div class="g3">${num("size","Ukuran huruf",o.size,6,200)}${col("color","Warna",o.color)}${sel("align","Rata",o.align,aligns)}</div>`;
  else if(o&&o.type==="text")h+=`<b>${esc(T("Kotak teks"))}</b><div class="g2"><label>${esc(T("Label di form"))}<input class="f" data-p="label" value="${esc(o.label)}" maxlength="60"></label><label>${esc(T("Kunci isian"))}<input class="f" data-p="field" value="${esc(o.field)}" maxlength="30"></label></div>
    <span class="hint">${esc(T("Kotak dengan kunci isian yang sama di ukuran lain diisi sekali saja."))}</span>
    <div class="g2">${sel("auto","Isi otomatis",o.auto,AUTOS)}<label>${esc(T("Isi bawaan"))}<input class="f" data-p="def" value="${esc(o.def)}" maxlength="200"></label></div>
    <div class="g3">${sel("font","Font",o.font,fonts)}${sel("weight","Tebal",o.weight,[[400,"Biasa"],[600,"Semi tebal"],[700,"Tebal"],[800,"Sangat tebal"]])}${col("color","Warna",o.color)}</div>
    <div class="g3">${num("size","Ukuran huruf",o.size,8,600)}${num("minSize","Ukuran terkecil",o.minSize,6,o.size)}${num("max","Maks. huruf",o.max,1,200)}</div>
    <div class="g2">${sel("align","Rata",o.align,aligns)}<label class="chk"><input type="checkbox" data-p="required"${o.required?" checked":""}> ${esc(T("Wajib diisi"))}</label></div>`;
  else if(o&&o.type==="speakers")h+=`<b>${esc(T("Area narasumber"))}</b><div class="g2">${sel("max","Maks. narasumber",o.max,[1,2,3,4,5,6].map(n=>[n,String(n)]))}${sel("font","Font",o.font,fonts)}</div>
    <div class="g2">${num("nameSize","Ukuran nama",o.nameSize,8,300)}${col("nameColor","Warna nama",o.nameColor)}</div><div class="g2">${num("titleSize","Ukuran jabatan",o.titleSize,6,300)}${col("titleColor","Warna jabatan",o.titleColor)}</div>
    <span class="hint">${esc(T("1–3 orang satu baris; 4 = 2+2; 5 = 3+2; 6 = 3+3."))}</span>`;
  else if(o&&o.type==="qr")h+=`<b>QR</b><div class="g2">${num("size","Ukuran",o.size,40,Math.min(z.w,z.h))}${col("color","Warna",o.color)}</div><span class="hint">${esc(T("Tidak wajib. Cabang bisa mematikan QR atau mengisi link sendiri."))}</span>`;
  else h+=`<span class="hint">${esc(T("Klik kotak di gambar untuk mengatur isinya. Logo dan disclaimer juga bisa diklik."))}</span>`;
  if(o&&ESEL!=="logo"&&ESEL!=="disc")h+=`<button type="button" class="btn sm danger" id="eDelSlot">${esc(T("Hapus kotak ini"))}</button>`;
  h+=`<div id="pMsg"></div><div class="acts"><button type="button" class="btn pri" id="eSave">${esc(T("Simpan ukuran"))}</button><span class="sp"></span><button type="button" class="btn sm danger" id="eDelSz">${esc(T("Hapus ukuran"))}</button></div>`;
  $("ePane").innerHTML=h;
  $("ePane").querySelectorAll("[data-p]").forEach(i=>i.addEventListener(i.type==="checkbox"||i.tagName==="SELECT"||i.type==="color"?"change":"input",()=>{
    const v=i.type==="checkbox"?i.checked:i.type==="number"||["max","weight"].includes(i.dataset.p)?+i.value:i.value;o[i.dataset.p]=v;drawBoxes();ePaint()}));
  $("eDark").onchange=()=>{ESZ.dark=$("eDark").checked;ePaint()};
  $("ePane").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const t=b.dataset.add,id=Math.random().toString(36).slice(2,8);
    const s=t==="text"?{id,type:"text",field:"teks_"+id.slice(0,3),label:T("Teks baru"),x:Math.round(z.w*.08),y:Math.round(z.h*.3),w:Math.round(z.w*.84),h:Math.round(z.w*.06),font:FONTS[0],weight:700,size:Math.round(z.w*.04),minSize:Math.round(z.w*.025),color:ESZ.dark?"#ffffff":"#17251d",align:"left",max:60,required:false,def:"",auto:""}
      :t==="speakers"?{id,type:"speakers",x:Math.round(z.w*.06),y:Math.round(z.h*.5),w:Math.round(z.w*.88),h:Math.round(z.h*.28),max:3,font:FONTS[1],nameSize:Math.round(z.w*.028),nameColor:"#0b5d3b",titleSize:Math.round(z.w*.02),titleColor:"#4a5a50"}
      :{id,type:"qr",x:Math.round(z.w*.75),y:Math.round(z.h*.78),size:Math.round(z.w*.17),color:"#000000"};
    ESZ.slots.push(s);ESEL=id;drawPane();drawBoxes();ePaint()});
  if($("eDelSlot"))$("eDelSlot").onclick=()=>{ESZ.slots=ESZ.slots.filter(s=>s.id!==ESEL);ESEL=null;drawPane();drawBoxes();ePaint()};
  $("eBg").onchange=async()=>{const f=$("eBg").files[0];if(!f)return;$("eBgM").textContent=T("Mengunggah…");
    const u=URL.createObjectURL(f),i=new Image();i.src=u;await new Promise(r=>{i.onload=r;i.onerror=r});

      ESZ.has_bg=1;ESZ.bgv=Date.now();EIMG=null;const s=ET.sizes.find(x=>x.id===ESZ.id);if(s)s.has_bg=1;

    catch(e){$("eBgM").textContent=e.message}};
  $("eSave").onclick=async()=>{const b=$("eSave");b.disabled=true;
    try{await api("/api/sizes",{id:ESZ.id,dark:ESZ.dark,logo:ESZ.logo,disc:ESZ.disc,slots:ESZ.slots});TPLS=null;const L=await loadTpls();ET=L.find(t=>t.id===ET.id);const s=ET.sizes.find(x=>x.id===ESZ.id);
      ESZ={...clone(s),bgv:ESZ.bgv};showMsg("pMsg",T("Tersimpan"),"ok");drawBoxes();ePaint()}catch(e){showMsg("pMsg",e.message)}finally{b.disabled=false}};
  $("eDelSz").onclick=async()=>{if(!confirm(T("Hapus ukuran ini beserta gambar latarnya?")))return;try{await api("/api/sizes",{id:ESZ.id,delete:true});ESZ=null;await window.editTpl(ET.id)}catch(e){showMsg("pMsg",e.message)}};
}
addEventListener("resize",()=>{if(ESZ&&!$("vEdit").hidden)drawBoxes()});

  if(m)return fill(m[1]);
