name: Laboratorium uji (mingguan)

on:
  schedule:
    # Sabtu 10:13 WIB (03:13 UTC). Jadwal GitHub bisa molor — tidak masalah untuk data mingguan.
    - cron: "13 3 * * 6"
  workflow_dispatch:

concurrency:
  group: d1-writer
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/sats/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sats/worker/package-lock.json

      - name: Install root (untuk scripts/deploy.mjs)
        working-directory: .
        run: npm ci

      - name: Install
        run: npm ci

      - name: Data cleaning tests
        run: npx tsx src/data/test-clean.ts

      - name: Backtest presets & pola (3 tahun)
        run: npx tsx src/pipeline/run-lab.ts

      - name: Config D1 (ID database sats-db dicari menurut nama -> wrangler.deploy.json)
        working-directory: .
        run: node scripts/deploy.mjs --resolve sats

      - name: Write to D1
        run: npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --file=out/lab.sql

      - name: Verify
        run: npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --command "SELECT verdict, COUNT(*) AS jumlah FROM lab_results GROUP BY verdict"

      - name: Keep run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ github.run_id }}
          path: apps/sats/worker/out/
          retention-days: 30
