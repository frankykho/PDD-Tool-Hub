name: Buat PDF produk
on:
  schedule:
    - cron: "0 0 * * *"      # tiap hari 07.00 WIB (jadwal GitHub bisa mundur beberapa menit)
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan kapan saja
permissions:
  contents: write
concurrency: pdf
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/pdf-generator
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}   # isi profile.json (sama dengan untuk deploy)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1 && npx playwright install --with-deps chromium
      - name: Alamat Fund Insight & Bond Insight dari profil
        # urls.fund / urls.bond kalau diisi; selain itu https://<nama-worker>.<subdomain>.workers.dev
        run: |
          node -e '
            const raw = (process.env.PROFILE_JSON || "").trim() || "{}";
            let p;  // profile.json boleh berkomentar (// ...), seperti yang dibaca scripts/deploy.mjs
            try { p = JSON.parse(raw); } catch { p = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, "").replace(/,(\s*[}\]])/g, "$1")); }
            const u = p.urls || {};
            const at = (name) => (p.subdomain ? `https://${name}.${p.subdomain}.workers.dev` : "");
            const fund = u.fund || at("fund-insight"), bond = u.bond || at("bond-insight");
            if (!fund || !bond) { console.error("Secret PROFILE_JSON belum berisi urls.fund/urls.bond atau subdomain."); process.exit(1); }
            console.log(`FUND_URL=${fund}\nBOND_URL=${bond}`);
          ' >> "$GITHUB_ENV"
      - name: Buat PDF
        run: node make-pdf.mjs
      - name: Unggah (file bernama sama ditimpa, jadi tidak menumpuk)
        if: always()
        run: |
          ls out/*.pdf >/dev/null 2>&1 || { echo "Tidak ada PDF baru, rilis tidak diubah."; exit 0; }
          gh release view pdf >/dev/null 2>&1 || gh release create pdf --title "PDF produk" --notes "Dibuat otomatis tiap hari. File lama ditimpa."
          gh release upload pdf out/*.pdf --clobber
          if [ -f out/keep.txt ]; then
            gh release view pdf --json assets -q '.assets[].name' | while read -r f; do
              grep -qxF "$f" out/keep.txt || { echo "hapus $f (produk sudah tidak ada)"; gh release delete-asset pdf "$f" -y; }
            done
          fi
      - name: Catat waktu jalan (juga menjaga jadwal tetap aktif)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.txt && git commit -m "PDF $(date -u +%F)" && git push || true
