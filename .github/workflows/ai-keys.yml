name: AI keys

# Pasang key AI gratis ke semua tool yang memakai AI (Edukasi, Market Recap, Content Insight, Competitor, Market News,
# Copy Studio, Tutorial, SATS) sekaligus, tanpa wrangler di komputer sendiri.
# 1. Simpan key sebagai secret repo: Settings > Secrets and variables > Actions > New repository secret
#    GROQ_API_KEY (console.groq.com) dan/atau GEMINI_API_KEY (aistudio.google.com).
# 2. Tab Actions > "AI keys" > Run workflow. Key yang tidak diisi di GitHub dilewati (secret lama di worker tetap).
on:
  workflow_dispatch:

jobs:
  ai-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pasang key AI
        run: node scripts/deploy.mjs ai-keys
