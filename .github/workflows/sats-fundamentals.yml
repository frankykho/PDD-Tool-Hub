name: Fundamentals (mingguan)

on:
  schedule:
    # Sabtu 08:00 WIB (01:00 UTC). Jadwal GitHub bisa molor beberapa jam — tidak masalah untuk data mingguan.
    - cron: "0 1 * * 6"
  workflow_dispatch:

concurrency:
  group: d1-writer
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sats/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sats/worker/package-lock.json

      - name: Install root (untuk scripts/deploy.mjs)
        working-directory: .
        run: npm ci

      - name: Install
        run: npm ci

      - name: Fetch fundamentals (Yahoo)
        run: npx tsx src/pipeline/run-fundamentals.ts

      - name: Config D1 (ID database sats-db dicari menurut nama -> wrangler.deploy.json)
        working-directory: .
        run: node scripts/deploy.mjs --resolve sats

      - name: Write to D1
        run: npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --file=out/fundamentals.sql

      - name: Verify
        run: npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --command "SELECT COUNT(*) AS saham, MAX(as_of) AS tanggal, SUM(profitable) AS untung FROM fund_latest"
