name: Pemegang saham ≥ 1% (bulanan)

# Daftar "Pemegang Saham di Atas 1%" (BEI/KSEI) terbit bulanan; snapshot-nya diambil dari idx-cli (lihat run-ownership.ts).
# Dicek tiap Senin; hanya bulan yang belum ada di D1 yang ditulis (hemat kuota tulis D1).
on:
  schedule:
    # Senin 09:37 WIB (02:37 UTC)
    - cron: "37 2 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Tulis ulang semua bulan di snapshot"
        type: boolean
        default: false

concurrency:
  group: d1-writer
  cancel-in-progress: false

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sats/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sats/worker/package-lock.json

      - name: Install root (untuk scripts/deploy.mjs)
        working-directory: .
        run: npm ci

      - name: Install
        run: npm ci

      - name: Tests
        run: |
          npx tsx src/ownership/test-holders.ts
          npx tsx src/ownership/test-owners.ts

      - name: Config D1 (ID database sats-db dicari menurut nama -> wrangler.deploy.json)
        working-directory: .
        run: node scripts/deploy.mjs --resolve sats

      - name: Bulan terakhir di D1
        id: last
        run: |
          L=$(npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --json --command "SELECT MAX(as_of) AS d FROM own_releases" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s)[0].results[0].d||"")}catch{console.log("")}})' || true)
          echo "Terakhir di D1: ${L:-(belum ada)}"
          echo "since=$L" >> "$GITHUB_OUTPUT"

      - name: Snapshot -> SQL
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ -z "${{ steps.last.outputs.since }}" ]; then
            npx tsx src/pipeline/run-ownership.ts
          else
            npx tsx src/pipeline/run-ownership.ts --since "${{ steps.last.outputs.since }}"
          fi

      - name: Write to D1
        run: |
          if [ -s out/ownership.sql ]; then
            npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --file=out/ownership.sql
          else
            echo "Tidak ada bulan baru."
          fi

      - name: Verify
        run: npx wrangler d1 execute sats-db --remote -c wrangler.deploy.json --command "SELECT as_of, rows FROM own_releases ORDER BY as_of DESC LIMIT 6"
